# НАШ СТЕНД. Всё, чего не должно быть у клиента (Р-030 ①).
#
# ⚠️ ФАЙЛ НАЗВАН `dev`, А НЕ `override`, И ЭТО ГЛАВНОЕ В НЁМ. Наложение
# с именем `override` Compose подхватывает САМ, без единого флага. Значит
# любой, у кого файл окажется рядом — а он окажется, если кому-то достанется
# репозиторий или полный архив, — молча получил бы публикацию портов
# и разрешение заводить чужие компании. Здесь подключение только явное,
# и живёт оно одной строкой в `Makefile`.
#
# Проверить, что клиент получает именно коробку:
#   docker compose -f compose.yml config
#
# ⚠️ ПОРТЫ ЖИВУТ ТОЛЬКО ЗДЕСЬ, И ОБРАТНО ИХ НЕ УБРАТЬ. Списочные поля
# наложение ДОПОЛНЯЕТ, а не заменяет: порт, once попавший в базовый файл,
# из наложения уже не вычесть. Поэтому в базовом их нет вовсе.

services:
  postgres:
    ports:
      # Только петля: снаружи машины база недоступна. Публикуем ради
      # миграций, psql и приёмочных тестов с хоста.
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

  # ⚠️ СБОРКА ОБЪЯВЛЕНА ТОЛЬКО У БЕКА, ХОТЯ ОБРАЗ ДЕЛЯТ ДВОЕ. `migrate`
  # берёт тот же образ по имени: два объявления сборки на один образ — это
  # две сборки одного и того же и два разных ответа на вопрос «что собрано».
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AMPLIFIE_VERSION: ${AMPLIFIE_VERSION:-}
    image: ${AMPLIFIE_IMAGE_API:-amplifie/api:latest}
    environment:
      # ⚠️ ЭТО ДЕВ-ЗНАЧЕНИЕ, И ЖИВЁТ ОНО ЗДЕСЬ ИМЕННО ПОЭТОМУ.
      # Продукт — коробка: одна установка, одна компания, все кроме первого
      # входят по приглашению (Р-024). Разрешение нужно только этому стенду:
      # сотня приёмочных заводит себе по компании на тест, иначе они мешали
      # бы друг другу в одной.
      AMPLIFIE_MULTI_WORKSPACE: ${AMPLIFIE_MULTI_WORKSPACE:-true}
    ports:
      # ⚠️ ТОЛЬКО ПЕТЛЯ И ТОЛЬКО ДЛЯ РАБОТЫ РУКАМИ. При `make work` фронт
      # поднимается своим сервером на 8477, а Caddy на это время гаснет —
      # значит к беку надо ходить напрямую.
      - "127.0.0.1:${API_HOST_PORT:-3477}:3000"

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        AMPLIFIE_VERSION: ${AMPLIFIE_VERSION:-}
    image: ${AMPLIFIE_IMAGE_WEB:-amplifie/web:latest}
