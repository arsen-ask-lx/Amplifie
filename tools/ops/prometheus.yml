# Настройки Prometheus для НАШЕГО СТЕНДА (task-088).
#
# ⚠️ ЭТО ОСНАСТКА, А НЕ ЧАСТЬ КОРОБКИ. Prometheus объявлен только
# в `compose.dev.yml`; клиент получает `compose.yml`, и там его нет.
# Проверяется командой `docker compose -f compose.yml config` — она обязана
# не содержать слова prometheus, и на это есть приёмочная проверка.
#
# Зачем он нам: измеритель этого проекта соврал четыре раза за один день.
# Числа от сервера (`/metrics`) дают второго свидетеля, но живут мгновением —
# перезапуск процесса обнуляет счётчики. Ряд во времени превращает замер
# из эксперимента в наблюдение.

global:
  # Часто, потому что наши замеры длятся десятки секунд: при минутном
  # опросе прогон целиком уместился бы между двумя точками.
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: amplifie
    static_configs:
      # Имя контейнера в сети compose, а не localhost: Prometheus смотрит
      # на api изнутри той же сети, и наружу порт api для этого не нужен.
      - targets: ["api:3000"]
        labels:
          instance: amplifie-api
