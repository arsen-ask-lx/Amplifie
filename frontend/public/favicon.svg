<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 35 442 442">
  <title>Amplifie</title>
  <!-- ⚠️ РАМКА С ПОЛЯМИ, А НЕ ВПРИТЫК ПО РИСУНКУ. В приложении знак
       обрезан по самому контуру — там это правильно, его размер задаёт
       вёрстка. Здесь нельзя: браузер переводит значок в 16 точек, край
       рисунка попадает МЕЖДУ пикселями, и на нём остаётся полупрозрачная
       кромка. На одних размерах она видна, на других нет — владелец
       и видел «пятнышко справа от кружка то на одной вкладке, то ни на
       одной». Пятнадцать единиц поля с каждой стороны, и краю есть куда
       сгладиться.

       Значок вкладки. -->
  <!--  ⚠️ КОНТУР — ТОТ ЖЕ, ЧТО В `src/shared/Logo.tsx`,
       и это единственное место, где он повторён. Иначе быть не может:
       значок вкладки браузер запрашивает ДО того, как выполнится хоть
       одна строка нашего кода. Расхождение двух копий стережёт
       `make favicon` — не совесть.

       ⚠️ ДВЕ ЧАСТИ КРАСЯТСЯ ПОРОЗНЬ, как и в приложении: корона —
       цветом текста, шарик — чёрным по прямому выбору владельца.
       Фон прозрачный: подложки владелец не захотел.

       ⚠️ ЦВЕТА МЕНЯЮТСЯ С ТЕМОЙ БРАУЗЕРА, А НЕ ПРИЛОЖЕНИЯ. Значок живёт
       раньше нашего кода и про выбранную внутри тему не знает и знать
       не может. Поэтому корона идёт по светлоте панели вкладок, а шарик
       остаётся чёрным в обоих режимах. -->
  <style>
    .корона { fill: #1f2328 }
    .шарик  { fill: #000000 }
    @media (prefers-color-scheme: dark) {
      .корона { fill: #e7eef3 }
      .шарик  { fill: #000000 }
    }
  </style>
