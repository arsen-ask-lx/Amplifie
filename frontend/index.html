<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Значок вкладки: тот же знак, что в сцепке с именем, и те же две
         части — корона по светлоте панели вкладок, шарик синий.

         ⚠️ ТОЛЬКО SVG, БЕЗ РАСТРОВЫХ ЗАПАСНЫХ. Они здесь были ровно сутки
         и ушли: у прозрачного PNG края сглаживаются по белому, а потом
         делаются прозрачными — вокруг синего кружка оставалась светлая
         кайма. Chrome берёт то одно, то другое, поэтому владелец видел
         пятнышко «на одной вкладке есть, на других нет».

         Добавлял я их, когда думал, что браузер не понимает SVG. Причина
         была другая — кеш значка на чужом порту, — а лишняя деталь
         осталась и начала вредить. Теперь одна.

         ⚠️ ЧИСЛО В КОНЦЕ АДРЕСА — НЕ УКРАШЕНИЕ. Браузер кеширует значки
         ПО АДРЕСУ и держит их упрямее всего остального: обычная
         перезагрузка их не трогает. Поднимать при правке знака. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <title>Amplifie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
