<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Значок вкладки: тот же знак, что в сцепке с именем. SVG, а не
         растр, — он красится под тему браузера и не мылится на плотных
         экранах. Запасного .ico нет намеренно: SVG-значки понимают все
         браузеры, которые мы поддерживаем.

         ⚠️ ЧИСЛО В КОНЦЕ АДРЕСА — ЭТО НЕ УКРАШЕНИЕ. Браузер кеширует
         значки вкладок ПО АДРЕСУ САЙТА и держит их упрямее всего
         остального: обычная перезагрузка их не трогает. А дев-сервер
         у всех на свете живёт на localhost:5173 — значит на этом адресе
         уже лежит значок какого-то ЧУЖОГО проекта, и владелец видел
         в своей вкладке именно его. Смена адреса заставляет браузер
         перечитать. Поднимать число при каждой правке значка. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Amplifie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
