<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Значок вкладки: тот же знак, что в сцепке с именем. SVG, а не
         растр, — он красится под тему браузера и не мылится на плотных
         экранах. Запасного .ico нет намеренно: SVG-значки понимают все
         браузеры, которые мы поддерживаем.

         ⚠️ ТРИ СТРОКИ, А НЕ ОДНА, И РАСТР НЕ ОТ НЕДОВЕРИЯ К SVG.
         SVG умеет меняться с темой браузера — его и берём первым, когда
         браузер его понял. Но «понимает» и «показывает в этой вкладке
         прямо сейчас» оказались разными вещами: владелец не видел наш
         знак, хотя сервер отдавал его с кодом 200. Растр понимает вообще
         всё, включая закладки, ярлыки и плитку на телефоне.

         Картинки СОБИРАЮТСЯ из того же `favicon.svg` — `make icons`.
         Рисовать их руками нельзя: разойдутся, и в разных местах будет
         разный знак.

         ⚠️ ЧИСЛО В КОНЦЕ АДРЕСА — ЭТО НЕ УКРАШЕНИЕ. Браузер кеширует
         значки вкладок ПО АДРЕСУ и держит их упрямее всего остального:
         обычная перезагрузка их не трогает. Поднимать при правке знака. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png?v=4" />
    <title>Amplifie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
