name: amplifie

# ⚠️ ЭТОТ ФАЙЛ ОПИСЫВАЕТ УСТАНОВКУ КЛИЕНТА, А НЕ НАШ СТЕНД (Р-030 ①).
#
# Было наоборот: базовый файл описывал стенд, а у трёх строк стоял комментарий
# «в прод-профиле этой строки не будет» — прод-профиля при этом не существовало.
# Клиент, взявший такой файл, получал публикацию портов и разрешение заводить
# на его сервере чужие компании.
#
# Теперь наоборот: здесь только то, что уезжает к людям, а наш стенд лежит
# в `compose.dev.yml` и подключается ЯВНЫМ `-f` внутри `make`.
#
# ⚠️ ИМЯ ДЕВ-ФАЙЛА НЕ `override`. Такое Compose подхватывает САМ, и любой,
# у кого файл окажется рядом, молча получил бы наши настройки. При явном
# подключении голое `docker compose up` в любой папке означает коробку.
#
# ⚠️ ОБРАЗЫ НАЗВАНЫ, А НЕ СОБИРАЮТСЯ ЗДЕСЬ. Откуда они взялись — `pull`
# из реестра или `load` из архива — этому файлу безразлично, и в этом
# всё дело: оба канала доставки подключаются потом, без переделки (Р-030 ②).

# ⚠️ ПРЕДЕЛ ЛОГОВ — ОДИН НА ВСЕ СЕРВИСЫ, И ОН ОБЯЗАТЕЛЕН (Р-030 ⑧).
#
# У драйвера `json-file` предела по умолчанию НЕТ ВОВСЕ. Болтливый сервис или
# перезапуск по кругу пишут гигабайты, пока не кончится диск, — и тогда падает
# вся машина, а не один контейнер. Коробка стоит у клиента, и её никто
# не обслуживает: этот отказ был бы нашим, а не его.
#
# Числами: 10 МБ × 3 файла = 30 МБ на сервис, около сотни на установку.
# Этого хватает, чтобы разобрать вчерашнюю поломку, и не хватает, чтобы
# съесть диск.
#
# ⚠️ ЯКОРЕМ, А НЕ ЧЕТЫРЬМЯ КОПИЯМИ. Числа — одно знание; разъехавшись
# по сервисам, они разъедутся и по смыслу.
#
# Пределы процессора и памяти здесь НЕ СТОЯТ и это не забывчивость: их числа
# зависят от О-5 («где сервер, какие мощности»), который не отвечен, а взятый
# с потолка предел сам становится причиной тихого отказа — убитого по памяти
# процесса под нагрузкой.

# ⚠️ ДЕСКРИПТОРЫ НАЗВАНЫ ЯВНО, И ЭТО ПРО ПРЕДСКАЗУЕМОСТЬ, А НЕ ПРО ЗАПАС.
#
# Открытая труба живых обновлений — это файловый дескриптор, и держим мы их
# тысячами. Предел по умолчанию задаёт демон Docker на ХОЗЯЙСКОЙ машине:
# у нас намерено 1 048 576, у клиента может оказаться 1024. Отказ при этом
# не плавный: новые подключения просто получают отказ, и для человека это
# «приложение не загружается» — причём у части людей и случайно.
#
# Числами под цель в 3000 вкладок: у Caddy это 3000 соединений снаружи
# плюс столько же к беку, у бека — 3000 плюс пул и файлы. 65536 даёт
# примерно десятикратный запас и не зависит от того, как настроен
# чужой сервер.
x-fds: &fds
  nofile:
    soft: 65536
    hard: 65536

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+: том вешается на /var/lib/postgresql, а НЕ на .../data.
      # Образ кладёт данные в подкаталог с номером мажорной версии — это то,
      # что потом позволит обновляться через `pg_upgrade --link` без возни
      # с границами монтирования. См. docker-library/postgres#1259.
      #
      # ⚠️ ИМЯ ТОМА ЗАМОРОЖЕНО (Р-030 ⑦). Переименовать его после первой
      # отданной установки — не «сломать совместимость», а потерять данные
      # клиента: старый том останется висеть, а продукт поднимется пустым.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ⚠️ ОДНОРАЗОВЫЙ СЕРВИС, А НЕ МИГРАЦИЯ ВНУТРИ СТАРТА БЕКА (Р-030 ③).
  #
  # Это наше же правило, записанное в конвейере: браузер ставится отдельным
  # шагом, «чтобы его отказ был виден отказом СВОЕГО шага». Миграция внутри
  # старта даёт клиенту бесконечный перезапуск вместо диагноза, а он один
  # на своём сервере и разбираться будет сам.
  #
  # ⚠️ ТОТ ЖЕ ОБРАЗ, ЧТО У БЕКА. Один артефакт, две команды: второго образа,
  # который надо отдельно собирать, отдельно возить и отдельно забывать
  # обновить, здесь нет.
  #
  # ⚠️ ЗАКОН ЛЮССЕРА НЕ НАРУШЕН: сервис отработал и умер. В рабочей цепочке
  # по-прежнему три узла, а не четыре.
  migrate:
    image: ${AMPLIFIE_IMAGE_API:-amplifie/api:latest}
    # Строкой, а не словом: в YAML голое no читается как «ложь».
    restart: "no"
    logging: *logging
    command: ["node", "backend/dist/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${AMPLIFIE_IMAGE_API:-amplifie/api:latest}
    restart: unless-stopped
    logging: *logging
    ulimits: *fds
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 3000
      # Сколько сервер ждёт ответа моста (task-001).
      # 25 секунд, а не две минуты: столько же длится тест «мост молчит»,
      # и прогон не должен вставать колом. И не 12, как было сначала:
      # живой ответ занял 16.5 с и не доехал — вопрос протух раньше модели.
      AMPLIFIE_BRIDGE_WAIT_MS: ${AMPLIFIE_BRIDGE_WAIT_MS:-25000}
      # Шифрование ключей участников (Р-016). Без него ключ сохранить
      # нельзя — и это лучше, чем сохранить его открытым.
      AMPLIFIE_SECRET_KEY: ${AMPLIFIE_SECRET_KEY}
      AMPLIFIE_SECRET_KEY_VERSION: ${AMPLIFIE_SECRET_KEY_VERSION:-1}
      AMPLIFIE_SECRET_KEY_PREV: ${AMPLIFIE_SECRET_KEY_PREV:-}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV}
      # ⚠️ РАЗРЕШЕНИЯ НА МНОГО КОМПАНИЙ ЗДЕСЬ НЕТ ВОВСЕ, и это главная
      # строка всего разделения. Не «=false»: приложение читает отсутствие
      # и `false` одинаково, а человек — по-разному. Увидев `false`, его
      # однажды переставят в `true`, чтобы «проверить». Чего нет,
      # то не переставляют. Стенду разрешение выдаёт `compose.dev.yml`.
    depends_on:
      postgres:
        condition: service_healthy
      # Бек не стартует, пока миграции не накатились: половина схемы хуже,
      # чем честное «не поднялось».
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Прокси + статика фронта одним образом: у фронта нет своего сервера.
  caddy:
    image: ${AMPLIFIE_IMAGE_WEB:-amplifie/web:latest}
    restart: unless-stopped
    logging: *logging
    ulimits: *fds
    ports:
      # Единственный порт наружу у всей установки.
      - "${HTTP_PORT}:80"
    volumes:
      # Имя тома заморожено — см. оговорку у pgdata выше.
      - caddy_data:/data
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
