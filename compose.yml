name: amplifie

# ⚠️ ПРЕДЕЛ ЛОГОВ — ОДИН НА ВСЕ СЕРВИСЫ, И ОН ОБЯЗАТЕЛЕН (Р-030 ⑧).
#
# У драйвера `json-file` предела по умолчанию НЕТ ВОВСЕ. Болтливый сервис или
# перезапуск по кругу пишут гигабайты, пока не кончится диск, — и тогда падает
# вся машина, а не один контейнер. Коробка стоит у клиента, и её никто
# не обслуживает: этот отказ был бы нашим, а не его.
#
# Числами: 10 МБ × 3 файла = 30 МБ на сервис, около сотни на установку.
# Этого хватает, чтобы разобрать вчерашнюю поломку, и не хватает, чтобы
# съесть диск.
#
# ⚠️ ЯКОРЕМ, А НЕ ТРЕМЯ КОПИЯМИ. Числа — одно знание; разъехавшись по сервисам,
# они разъедутся и по смыслу. Появится четвёртый сервис (`migrate`) — он получит
# ту же строку, а не свою.
#
# Пределы процессора и памяти здесь НЕ СТОЯТ и это не забывчивость: их числа
# зависят от О-5 («где сервер, какие мощности»), который не отвечен, а взятый
# с потолка предел сам становится причиной тихого отказа — убитого по памяти
# процесса под нагрузкой.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+: том вешается на /var/lib/postgresql, а НЕ на .../data.
      # Образ кладёт данные в подкаталог с номером мажорной версии — это то,
      # что потом позволит обновляться через `pg_upgrade --link` без возни
      # с границами монтирования. См. docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Только петля: снаружи машины база недоступна. Публикуем ради
      # миграций, psql и приёмочных тестов с хоста. В прод-профиле этой
      # строки не будет.
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 3000
      # Сколько сервер ждёт ответа моста (task-001).
      # 25 секунд, а не две минуты: столько же длится тест «мост молчит»,
      # и прогон не должен вставать колом. И не 12, как было сначала:
      # живой ответ занял 16.5 с и не доехал — вопрос протух раньше модели.
      AMPLIFIE_BRIDGE_WAIT_MS: ${AMPLIFIE_BRIDGE_WAIT_MS:-25000}
      # Шифрование ключей участников (Р-016). Без него ключ сохранить
      # нельзя — и это лучше, чем сохранить его открытым.
      AMPLIFIE_SECRET_KEY: ${AMPLIFIE_SECRET_KEY}
      AMPLIFIE_SECRET_KEY_VERSION: ${AMPLIFIE_SECRET_KEY_VERSION:-1}
      AMPLIFIE_SECRET_KEY_PREV: ${AMPLIFIE_SECRET_KEY_PREV:-}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV}
      # ⚠️ ЭТО ДЕВ-ЗНАЧЕНИЕ, И В НАСТОЯЩЕЙ УСТАНОВКЕ ЕГО БЫТЬ НЕ ДОЛЖНО.
      # Продукт — коробка: одна установка, одна компания, все кроме
      # первого входят по приглашению (Р-024). Разрешение нужно только
      # этому стенду: сотня приёмочных заводит себе по компании на тест,
      # иначе они мешали бы друг другу в одной.
      #
      # По умолчанию в самом приложении — «нельзя»: настройка, которую
      # забудут, обязана быть безопасной. Здесь она включена ЯВНО, чтобы
      # при сборке прод-профиля её было видно и легко выкинуть — та же
      # причина, по которой рядом помечена публикация порта Postgres.
      AMPLIFIE_MULTI_WORKSPACE: ${AMPLIFIE_MULTI_WORKSPACE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # ⚠️ ТОЛЬКО ПЕТЛЯ И ТОЛЬКО ДЛЯ РАБОТЫ РУКАМИ. При `make work` фронт
      # поднимается своим сервером на 8477, а Caddy на это время гаснет —
      # значит к беку надо ходить напрямую. Снаружи машины порт закрыт;
      # в прод-профиле этой строки не будет, как и у Postgres рядом.
      - "127.0.0.1:${API_HOST_PORT:-3477}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Прокси + статика фронта одним образом: у фронта нет своего сервера.
  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
