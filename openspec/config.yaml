schema: spec-driven

# ⚠️ ЭТОТ ФАЙЛ — ГРАНИЦА МЕЖДУ ТРЕМЯ ДОМАМИ ДОКУМЕНТОВ, А НЕ НАСТРОЙКА ЯЗЫКА.
# Он читается агентом перед созданием каждого артефакта, поэтому правило
# «где что живёт» стоит здесь, а не в чьей-то памяти. Разбор и причина —
# Р-027; закрывает Д-12 (два дома для планов).

context: |
  Язык: русский. Все артефакты пишутся по-русски.
  Структурные заголовки OpenSpec и ключевые слова SHALL/MUST/WHEN/THEN
  остаются английскими — по ним работает валидатор.

  ГДЕ ЧТО ЖИВЁТ. У проекта три жанра документов, и каждый отвечает
  на СВОЙ вопрос. Пересказывать соседа запрещено: вторая копия знания
  расходится с первой молча.

    dock/decisions.md  — ПОЧЕМУ выбрано так, а не соседним способом.
                       Решения со ссылками на источники, гейт `make decisions`.
    dock/tasks/      — КАК делаем, ЧЕМ докажем и ЧТО из этого вышло.
                       План с арбитром и лог выполнения. Сделанный план
                       неизменяем: это запись о случившемся.
    openspec/specs/  — ЧТО система обязана делать СЕЙЧАС. Единственная
                       истина о наблюдаемом поведении.

  КОГДА ЗАВОДИТСЯ ИЗМЕНЕНИЕ. Только если меняется внешне наблюдаемое
  поведение: протокол, ручка, форма ответа, правило видимости, код отказа.
  Косметика, оснастка, рефакторинг и перенос файлов идут планом
  в dock/tasks/ и изменения здесь не заводят.

# ⚠️ КАЖДОЕ ПРАВИЛО В КАВЫЧКАХ, И ЭТО НЕ ВКУСОВЩИНА. Строка с двоеточием
# и пробелом внутри читается YAML как словарь, а не как текст; `doctor`
# на это отвечает «rules must be an array of strings, ignoring» — то есть
# правило молча не доезжает до агента. Поймано `openspec doctor` сразу
# после написания.
rules:
  proposal:
    - "Ссылаться на решение из dock/decisions.md номером (Р-NNN), а не пересказывать его. Причина выбора живёт там и только там."
    - "Раздел Capabilities обязателен и конкретен — он контракт между предложением и спекой."
  specs:
    - "Только внешне наблюдаемое поведение. Проверка одной фразой: если реализацию можно изменить, не меняя того, что видит человек или другая система, этому здесь не место."
    - "Ни имён функций и классов, ни выбора библиотек, ни порядка шагов: этому место в design.md и tasks.md."
    - "Каждый сценарий обязан быть проверяемым — у нас его проверяет приёмочный тест по живому стеку."
  design:
    - "Расхождения с принятыми решениями называть строкой вида «Р-NNN требует X, здесь предлагается Y, потому что Z» — либо «расхождений нет»."
    - "Не пересказывать proposal. Ссылаться на него."
  tasks:
    - "Шаги реализации живут в плане dock/tasks/task-NNN.md, если план заведён. Здесь тогда остаётся сдача — арбитр, синхронизация спеки, архивация — и ссылка на план. Два списка шагов расходятся молча."
    - "У каждого пункта названо, чем проверяется завершённость: тест, команда или наблюдаемое поведение."

operations:
  archive:
    guidance:
      - Синхронизировать дельту в openspec/specs/ ДО перемещения изменения. Незакрытое изменение и есть вторая правда о поведении.
      - Архивировать в тот же день, когда работа сдана. Гейт `make openspec` роняет сборку, если изменение висит дольше срока.
      - Обновить карту проекта dock/README.md тем же коммитом - этого требует гейт `make map`.
